apiVersion: apps/v1
kind: Deployment
metadata:
  name: dv-eval-api
  namespace: dv-eval
  labels:
    app.kubernetes.io/name: dv-eval-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # Recreate is required when the PVC is ReadWriteOnce: the old pod must fully
  # terminate and release the volume before the new pod can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dv-eval-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dv-eval-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Replace with your registry path, e.g. gcr.io/my-project/dv-eval-harness:latest
          image: dv-eval-harness:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dv-eval-secrets
                  key: ANTHROPIC_API_KEY
                  # optional: true allows the pod to start even if the secret key is absent
                  optional: true
            - name: DV_LLM_MODEL
              value: "claude-sonnet-4-6"
          volumeMounts:
            - name: traces
              mountPath: /app/traces
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: traces
          persistentVolumeClaim:
            claimName: traces-pvc
